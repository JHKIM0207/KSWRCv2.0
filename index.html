2=Math.hypot(q.x,q.y);\n      const radialAngle=r2>0.001?Math.atan2(-q.y,-q.x):0;\n      const baseR=38;\n      ctx.save();\n      ctx.translate(px,py);\n      ctx.rotate(radialAngle);\n      ctx.beginPath();\n      ctx.setLineDash([9,7]);\n      ctx.lineWidth=3;\n      ctx.strokeStyle='rgba(255,255,255,.95)';\n      ctx.ellipse(0,0,baseR*Math.max(q.z,.15),baseR,0,0,Math.PI*2);\n      ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.restore();\n    }\n    ctx.restore();\n\n    cvs._markers.push({x:px,y:py,r:58*cvs.width/1200,data:r});\n    shown++;\n  });\n  const st=document.getElementById('solar-disk-image-status');\n  if(st) st.textContent=`NASA SDO/HMI latest · AR labels ${shown}`;\n  return shown;\n}\nfunction renderRegionCards(){\n  const panel=document.getElementById('solar-regions-panel');\n  panel.innerHTML=solarRegionsData.map(r=>{const sev=severityFromMag(r.mag,r.m,r.x);return `<div class=\"region-card\" data-ar=\"${r.ar}\"><div class=\"region-head\"><div><div class=\"region-ar\">AR ${r.ar}<\u002Fdiv><div class=\"region-loc\">${r.loc}<\u002Fdiv><\u002Fdiv><div class=\"region-badge\" style=\"${sev[1]}\">${sev[0]}<\u002Fdiv><\u002Fdiv><div class=\"region-meta\"><div class=\"meta-box\"><div class=\"meta-k\">Magnetic<\u002Fdiv><div class=\"meta-v\">${r.mag}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">McIntosh<\u002Fdiv><div class=\"meta-v\">${r.mc}<\u002Fdiv><div class=\"mc-level\">${mcIntoshComplexity(r.mc).level}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Area<\u002Fdiv><div class=\"meta-v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"meta-box\"><div class=\"meta-k\">Spots<\u002Fdiv><div class=\"meta-v\">${r.spots}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"region-bars\">${[['C',r.c,'#44d17a'],['M',r.m,'#ffb84d'],['X',r.x,'#ff5c7a']].map(v=>`<div class=\"forecast-row\"><div class=\"forecast-label\">${v[0]}<\u002Fdiv><div class=\"prob-bar\"><div class=\"prob-fill\" style=\"width:${Math.max(0,Math.min(100,v[1]))}%;background:${v[2]}\"><\u002Fdiv><\u002Fdiv><div class=\"prob-val\">${v[1]}%<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>`}).join('');\n  panel.querySelectorAll('.region-card').forEach(el=>{el.classList.toggle('active',selectedRegion&&String(el.dataset.ar)===String(selectedRegion.ar));el.style.cursor='pointer';el.onclick=()=>{const r=solarRegionsData.find(x=>String(x.ar)===el.dataset.ar);if(r)showRegionDetail(r)}});\n}\nfunction getSunspotSeries(ar){\n  const key=String(ar),byDay={};\n  const addRow=(raw,source)=>{\n    const rawAr=firstValue(raw,['region','region_number','ar','active_region','noaa_region','noaa_ar','region_id'],'');\n    if(String(rawAr)!==key)return;\n    const row=normalizeRegion(raw), ds=(row.observed||obsTime(raw)).slice(0,10);\n    if(!ds)return;\n    const candidate={date:ds,area:row.area,spots:row.spots,loc:row.loc,mc:row.mc,mag:row.mag,m:row.m,x:row.x,source};\n    const old=byDay[ds];\n    if(!old || candidate.area>old.area || (candidate.area===old.area&&candidate.spots>old.spots))byDay[ds]=candidate;\n  };\n  // solar_regions.json itself contains multiple dated records and provides the most\n  // reliable AR-number linkage. Use it as the primary history source.\n  for(const raw of solarRegionHistoryData||[])addRow(raw,'solar_regions');\n  // Add matching observatory reports when sunspot_report exposes a NOAA region number.\n  for(const raw of sunspotReportData||[])addRow(raw,'sunspot_report');\n  return Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);\n}\nfunction drawSpark(canvasId,series,key,color,label){\n  const c=document.getElementById(canvasId);if(!c)return;\n  const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;\n  const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);\n  const ml=40,mr=34;\n  ctx.strokeStyle='rgba(255,255,255,.1)';for(let i=0;i<4;i++){const yy=12+i*(h-28)/3;ctx.beginPath();ctx.moveTo(ml,yy);ctx.lineTo(w-mr,yy);ctx.stroke()}\n  if(!series.length){ctx.fillStyle='#9fb5d1';ctx.font='14px system-ui';ctx.fillText('No recent region history is available for this AR.',12,h/2);c._spec=null;return}\n  const vals=series.map(dd=>Number(dd[key]||0)),min=Math.min(...vals),max=Math.max(...vals,min+1);\n  const x=i=>ml+(w-ml-mr)*(series.length===1?.5:i/(series.length-1)),y=v=>h-22-(h-42)*((v-min)/(max-min||1));\n  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();series.forEach((dd,i)=>i?ctx.lineTo(x(i),y(dd[key])):ctx.moveTo(x(i),y(dd[key])));ctx.stroke();\n  ctx.fillStyle=color;series.forEach((dd,i)=>{ctx.beginPath();ctx.arc(x(i),y(dd[key]),3.5,0,Math.PI*2);ctx.fill()});\n  ctx.fillStyle='#8ea6c6';ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';\n  ctx.fillText(String(max),ml-6,12);ctx.fillText(String(min),ml-6,h-22);\n  ctx.textAlign='center';series.forEach((dd,i)=>{ctx.fillStyle='#8ea6c6';ctx.fillText(dd.date.slice(5),x(i),h-5)});\n  c._spec={series,key,x,y,color,label,min,max,w,h};\n  if(!c.dataset.sparkBound){\n    c.dataset.sparkBound='1';\n    c.addEventListener('pointermove',e=>{\n      const spec=c._spec;if(!spec)return;\n      const r=c.getBoundingClientRect(),px=(e.clientX-r.left);\n      let nearest=0,best=Infinity;\n      spec.series.forEach((dd,i)=>{const dist=Math.abs(spec.x(i)-px);if(dist<best){best=dist;nearest=i}});\n      const dd=spec.series[nearest],vx=spec.x(nearest),vy=spec.y(dd[spec.key]);\n      const ctx2=c.getContext('2d');\n      drawSpark(canvasId,spec.series,spec.key,spec.color,spec.label);\n      ctx2.save();ctx2.strokeStyle='rgba(255,255,255,.35)';ctx2.setLineDash([3,3]);ctx2.beginPath();ctx2.moveTo(vx,12);ctx2.lineTo(vx,spec.h-22);ctx2.stroke();ctx2.setLineDash([]);\n      ctx2.fillStyle=spec.color;ctx2.beginPath();ctx2.arc(vx,vy,5,0,Math.PI*2);ctx2.fill();ctx2.strokeStyle='#04101b';ctx2.lineWidth=1.5;ctx2.stroke();\n      const text=`${dd.date}: ${dd[spec.key]}`;ctx2.font='12px system-ui';const tw=ctx2.measureText(text).width+16;\n      const bx=Math.min(Math.max(vx-tw/2,2),spec.w-tw-2),by=Math.max(vy-30,2);\n      ctx2.fillStyle='rgba(5,11,20,.95)';ctx2.strokeStyle='rgba(255,255,255,.25)';ctx2.beginPath();ctx2.roundRect(bx,by,tw,20,5);ctx2.fill();ctx2.stroke();\n      ctx2.fillStyle='#eef6ff';ctx2.textAlign='left';ctx2.textBaseline='middle';ctx2.fillText(text,bx+8,by+10);\n      ctx2.restore();\n    });\n    c.addEventListener('pointerleave',()=>drawSpark(canvasId,c._spec.series,c._spec.key,c._spec.color,c._spec.label));\n  }\n}\nfunction showRegionDetail(r){selectedRegion=r;renderRegionCards();requestAnimationFrame(()=>drawSolarDisk());const box=document.getElementById('region-detail-panel'),series=getSunspotSeries(r.ar);const flrs=(state.data.flr||[]).filter(f=>String(f.activeRegionNum)===String(r.ar)).sort((a,b)=>new Date(b.beginTime)-new Date(a.beginTime));const flareHistoryHtml=flrs.length?`<div class=\"sunspot-mini-table\" style=\"margin-top:10px\"><div class=\"sunspot-mini-row sunspot-mini-head\"><div>Class<\u002Fdiv><div>Begin (UTC)<\u002Fdiv><div>Peak (UTC)<\u002Fdiv><div>End (UTC)<\u002Fdiv><\u002Fdiv>${flrs.map(f=>`<div class=\"sunspot-mini-row\"><div>${f.classType||'?'}<\u002Fdiv><div>${f.beginTime?f.beginTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><div>${f.peakTime?f.peakTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><div>${f.endTime?f.endTime.slice(0,16).replace('T',' '):'-'}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`:'<div class=\"muted\" style=\"margin-top:10px\">최근 7일 내 이 활동영역의 플레어 기록 없음<\u002Fdiv>';box.innerHTML=`<h4>AR ${r.ar}<\u002Fh4><div class=\"muted\">${r.loc} · Magnetic ${r.mag} · McIntosh ${r.mc} (${mcIntoshComplexity(r.mc).level})<\u002Fdiv><div class=\"mc-explain\"><strong>McIntosh 복잡도:<\u002Fstrong> ${mcIntoshComplexity(r.mc).detail}<\u002Fdiv><div class=\"region-stats\"><div class=\"trend-box\"><div class=\"k\">Current Area<\u002Fdiv><div class=\"v\">${r.area}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">Current Spots<\u002Fdiv><div class=\"v\">${r.spots}<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">M Probability<\u002Fdiv><div class=\"v\">${r.m}%<\u002Fdiv><\u002Fdiv><div class=\"trend-box\"><div class=\"k\">X Probability<\u002Fdiv><div class=\"v\">${r.x}%<\u002Fdiv><\u002Fdiv><\u002Fdiv><h5 style=\"margin:12px 0 4px\">Flare History (NASA DONKI, 7일)<\u002Fh5>${flareHistoryHtml}<div class=\"spark-wrap\"><h5>Area Trend<\u002Fh5><canvas id=\"spark-area\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"spark-wrap\"><h5>Spot Count Trend<\u002Fh5><canvas id=\"spark-spots\" class=\"spark\"><\u002Fcanvas><\u002Fdiv><div class=\"sunspot-mini-table\" style=\"margin-top:10px\"><div class=\"sunspot-mini-row sunspot-mini-head\" style=\"grid-template-columns:88px 92px 64px 60px 70px 70px 50px 50px\"><div>Date<\u002Fdiv><div>Location<\u002Fdiv><div>Area<\u002Fdiv><div>Spots<\u002Fdiv><div>Magnetic<\u002Fdiv><div>McIntosh<\u002Fdiv><div>M%<\u002Fdiv><div>X%<\u002Fdiv><\u002Fdiv>${series.map(s=>`<div class=\"sunspot-mini-row\" style=\"grid-template-columns:88px 92px 64px 60px 70px 70px 50px 50px\"><div>${s.date}<\u002Fdiv><div>${s.loc}<\u002Fdiv><div>${s.area}<\u002Fdiv><div>${s.spots}<\u002Fdiv><div>${s.mag||'-'}<\u002Fdiv><div>${s.mc||'-'}<\u002Fdiv><div>${Number.isFinite(s.m)?s.m:'-'}<\u002Fdiv><div>${Number.isFinite(s.x)?s.x:'-'}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"data-source-note\">Area and spot-count history uses NOAA SWPC daily composite region observations. These are combined reports from multiple observatories and may not represent a single instantaneous measurement.<br><a href=\"https://services.swpc.noaa.gov/json/solar_regions.json\" target=\"_blank\" rel=\"noopener\">solar_regions.json ↗<\u002Fa> · <a href=\"https://services.swpc.noaa.gov/json/sunspot_report.json\" target=\"_blank\" rel=\"noopener\">sunspot_report.json ↗<\u002Fa> · <a href=\"https://www.spaceweather.gov/products/summary-space-weather-observations\" target=\"_blank\" rel=\"noopener\">NOAA product description ↗<\u002Fa><\u002Fdiv>`;requestAnimationFrame(()=>{drawSpark('spark-area',series,'area','#ffb84d','Area');drawSpark('spark-spots',series,'spots','#59d0ff','Spots')})}\nasync function loadSunspotReport(){try{const r=await fetch('https://services.swpc.noaa.gov/json/sunspot_report.json?t='+Date.now(),{cache:'no-store'});sunspotReportData=await r.json()}catch(e){console.warn('sunspot_report failed',e);sunspotReportData=[]}}\nasync function loadSolarRegions(){\n  const status=document.getElementById('solar-regions-status');\n  try{\n    status.textContent='Updating...';const res=await fetch('https://services.swpc.noaa.gov/json/solar_regions.json?t='+Date.now(),{cache:'no-store'}),data=await res.json();\n    const rawRows=Array.isArray(data)?data:[];const norm=rawRows.map(normalizeRegion).filter(r=>r.ar!=='-');solarRegionHistoryData=rawRows;\n    const latestDate=norm.map(r=>r.observed.slice(0,10)).filter(Boolean).sort().pop()||'';\n    const candidates=latestDate?norm.filter(r=>r.observed.startsWith(latestDate)):norm;\n    const byAr=new Map();for(const r of candidates){const old=byAr.get(String(r.ar));if(!old||r.observed>old.observed)byAr.set(String(r.ar),r)}\n    solarRegionsData=[...byAr.values()].sort((a,b)=>(b.x*100+b.m*10+b.area)-(a.x*100+a.m*10+a.area));\n    renderRegionCards();drawSolarDisk();status.textContent=`Updated · ${solarRegionsData.length} active regions · ${latestDate||'latest'}`;\n    if(solarRegionsData.length){const keep=solarRegionsData.find(r=>selectedRegion&&String(r.ar)===String(selectedRegion.ar));showRegionDetail(keep||solarRegionsData[0])}\n  }catch(e){status.textContent='Failed to load active regions';console.error(e)}\n}\nconst disk=document.getElementById('solar-disk');if(disk){disk.addEventListener('mousemove',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height);disk.style.cursor=(disk._markers||[]).some(m=>Math.hypot(m.x-x,m.y-y)<=m.r)?'pointer':'zoom-in'});disk.addEventListener('click',ev=>{const r=disk.getBoundingClientRect(),x=(ev.clientX-r.left)*(disk.width/r.width),y=(ev.clientY-r.top)*(disk.height/r.height),hit=(disk._markers||[]).find(m=>Math.hypot(m.x-x,m.y-y)<=m.r);if(hit){showRegionDetail(hit.data);return}const img=document.getElementById('solar-disk-image');if(img&&img.src){document.getElementById('modal-img').src=img.src;document.getElementById('modal-img').alt='Latest NASA SDO HMI continuum solar disk';document.getElementById('modal').classList.add('open')}})}\nloadSolarProbabilities();\nPromise.allSettled([loadSunspotReport(),loadSolarRegions()]).then(()=>loadSolarRegions());\nloadSolarDiskImage();\nsetInterval(loadSolarProbabilities,30*60*1000);setInterval(()=>{loadSunspotReport().then(loadSolarRegions)},60*60*1000);setInterval(loadSolarDiskImage,10*60*1000);\n\nwindow.addEventListener('resize',()=>requestAnimationFrame(()=>drawSolarDisk()));\nsetTimeout(()=>drawSolarDisk(),1500);\nsetTimeout(()=>drawSolarDisk(),3500);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
