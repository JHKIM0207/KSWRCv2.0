name: Build and deploy magnetosphere model

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - index.html
      - ovation_combined_dashboard.html
      - assets/**
      - scripts/generate-magnetosphere.py
      - scripts/update-wind-history.mjs
      - requirements-magnetosphere.txt
      - .github/workflows/magnetosphere-model.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh solar-wind inputs for this build
        run: node scripts/update-wind-history.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install field-model dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-magnetosphere.txt
          python - <<'PY'
          import site
          import urllib.request
          from pathlib import Path

          target = Path(site.getsitepackages()[0]) / 'geopack' / 'igrf_coeffs' / 'igrf14coeffs.txt'
          target.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(
              'https://www.ngdc.noaa.gov/IAGA/vmod/coeffs/igrf14coeffs.txt',
              target,
          )
          print(f'Installed {target}')
          PY

      - name: Generate IGRF-14 and T96 snapshot
        run: python scripts/generate-magnetosphere.py

      - name: Validate model artifact
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path('data/magnetosphere/latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1
          assert len(data['lines']['closed']) >= 4
          assert len(data['lines']['closed']) + len(data['lines']['open']) >= 8
          for topology in ('closed', 'open'):
              for line in data['lines'][topology]:
                  assert len(line) >= 3
                  assert all(
                      len(point) == 3
                      and all(math.isfinite(value) for value in point)
                      for point in line
                  )
          print(data['diagnostics'])
          PY

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'requirements-magnetosphere.txt'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
