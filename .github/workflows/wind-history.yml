name: Update wind history

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-history-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/update-wind-history.mjs

      - run: node scripts/update-donki.mjs

      - run: node scripts/update-cactus.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wind-history data/donki data/cactus
          git diff --cached --quiet || git commit -m "Update wind history, DONKI FLR, and CACTUS data"
          git push
